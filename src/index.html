<!DOCTYPE html>
<html lang="en">
<head>

    <title>Yousef Abudabos — Cloud & DevOps Engineer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

            min-height: 100vh;

        }

            flex-wrap: wrap;
            gap: 0.75rem;

        }
        .skill {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 0.4rem 1rem;
            border-radius: 20px;

            margin: 0 1rem;

        }
        .links a:hover { text-decoration: underline; }

            color: #475569;

<body>
    <div class="container">

        <div class="links">

            <a href="https://linkedin.com/in/yousefabudabos" target="_blank">LinkedIn</a>
